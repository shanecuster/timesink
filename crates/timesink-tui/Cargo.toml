[package]
name = "timesink-tui"
version.workspace = true
edition.workspace = true
description = "Terminal interface for timesink: charts of where your time went"

# The program is called `timesink`; the daemon is `timesink-daemon`.
[[bin]]
name = "timesink"
path = "src/main.rs"

[dependencies]
# Shared model, database, app names and statistics.
timesink-core = { path = "../timesink-core" }
anyhow = "1"
# ratatui draws the screens; crossterm reads the keyboard and controls the terminal.
ratatui = "0.30"
crossterm = "0.29"
# chrono: local time zone and calendar dates.
chrono = "0.4"
# serde_json: writes the JSON export with correct escaping.
serde_json = "1"
# ureq: a small blocking HTTP client for talking to CouchDB (`timesink sync`).
ureq = { version = "2", features = ["json"] }
# base64: the "Authorization: Basic" header for CouchDB.
base64 = "0.22"
