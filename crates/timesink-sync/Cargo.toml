[package]
name = "timesink-sync"
version.workspace = true
edition.workspace = true
description = "CouchDB sync for timesink, shared by the terminal app and the Android app"

[dependencies]
# The database and the per-day documents that are synced.
timesink-core = { path = "../timesink-core" }
anyhow = "1"
serde_json = "1"
# ureq: a small blocking HTTP client for talking to CouchDB.
ureq = { version = "2", features = ["json"] }
# base64: the "Authorization: Basic" header for CouchDB.
base64 = "0.22"
